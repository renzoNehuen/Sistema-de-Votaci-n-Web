<div class="login-page">

  <div class="login-card">

    <h2 class="title">Login</h2>

    <div class="field">
      <label for="email">Email</label>
      <input
        pInputText
        id="email"
        type="email"
        [(ngModel)]="email"
        placeholder="Ingrese su email">
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
        <p-password
            id="password"
            [(ngModel)]="password"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="Ingrese su contraseña"
            styleClass="w-full">
        </p-password>
    </div>

    <p-button
      label="Sign In"
      styleClass="login-btn"
      (click)="login()">
    </p-button>

  </div>

  <p-toast></p-toast>

</div>
