<div class="home-container">

  <app-header></app-header>
  <p-toast></p-toast>

  <section class="hero">

    <h1>Ingrese su documento para votar</h1>

    <div class="document-box">

      <input
        pInputText
        type="text"
        placeholder="Cédula"
        [(ngModel)]="document">

      <p-button
        icon="pi pi-search"
        shape="circle"
        (click)="searchDocument()">
      </p-button>

    </div>

  </section>

  <section class="candidates-section" *ngIf="showCandidates">

    <h2>Candidatos</h2>

    <div class="cards-grid">

      <p-card
        *ngFor="let candidate of candidates"
        [header]="candidate.name + ' ' + candidate.lastName">

        <ng-template pTemplate="content">

          <div class="candidate-body">

            <div class="avatar-placeholder"></div>

            <p-button
              label="Votar"
              icon="pi pi-check"
              (click)="vote(candidate.id)">
            </p-button>

          </div>

        </ng-template>

      </p-card>

    </div>

  </section>

</div>
