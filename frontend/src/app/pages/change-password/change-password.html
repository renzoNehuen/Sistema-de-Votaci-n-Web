<app-header></app-header>

<div class="container">
  <div class="card">

    <div class="field">
      <label>Contraseña actual</label>
      <p-password 
        [(ngModel)]="currentPassword"
        [feedback]="false"
        [toggleMask]="true"
        placeholder="Value"
        styleClass="w-full">
      </p-password>
    </div>

    <div class="field">
      <label>Nueva Contraseña</label>
      <p-password 
        [(ngModel)]="newPassword"
        [feedback]="false"
        [toggleMask]="true"
        placeholder="Value"
        styleClass="w-full">
      </p-password>
    </div>

    <div class="field">
      <label>Confirmar nueva contraseña</label>
      <p-password 
        [(ngModel)]="confirmPassword"
        [feedback]="false"
        [toggleMask]="true"
        placeholder="Value"
        styleClass="w-full">
      </p-password>
    </div>

    <button 
      pButton 
      label="Guardar" 
      class="save-btn"
      (click)="save()">
    </button>

  </div>
</div>
